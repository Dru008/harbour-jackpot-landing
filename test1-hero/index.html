<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbour Jackpot · €1,000,000 starting jackpot · Harbour Play</title>
  <meta name="description" content="Harbour Jackpot is a new weekly draw from Harbour Play, every Saturday at 21:00. Tickets €3, starting jackpot €1,000,000. 18+ only. Play responsibly.">

  <!-- Fonts: Alata (display) and Inter (jackpot in Black, small print). Both include Maltese letters (Ħ ħ Ġ ġ Ż ż). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@400;500;900&display=swap">

  <link rel="stylesheet" href="hero.css">
</head>
<body>

  <section class="hero" aria-labelledby="hero-heading">

    <!-- Artwork exported from the Figma banners with every text layer removed: background, luzzu and wave.
         All the words are live HTML on top. Art direction: 3:4 crop on mobile, 16:5 on desktop. -->
    <picture class="hero__art">
      <source media="(min-width: 768px)" type="image/avif" srcset="assets/hero-desktop-1280.avif 1280w, assets/hero-desktop-1920.avif 1920w" sizes="100vw" width="1920" height="600">
      <source media="(min-width: 768px)" type="image/webp" srcset="assets/hero-desktop-1280.webp 1280w, assets/hero-desktop-1920.webp 1920w" sizes="100vw" width="1920" height="600">
      <source type="image/avif" srcset="assets/hero-mobile-450.avif 450w, assets/hero-mobile-750.avif 750w" sizes="100vw" width="750" height="1000">
      <img src="assets/hero-mobile-750.webp" srcset="assets/hero-mobile-450.webp 450w, assets/hero-mobile-750.webp 750w" sizes="100vw" width="750" height="1000" alt="" fetchpriority="high" decoding="async">
    </picture>

    <div class="hero__content">
      <img class="hero__logo" src="assets/harbourplay-logo.svg" width="185" height="76" alt="Harbour Play">

      <h1 class="hero__heading" id="hero-heading">
        <span class="hero__eyebrow">Starting jackpot</span>
        <span class="hero__jackpot">€1,000,000</span>
        <span class="hero__meta">
          <span>Harbour Jackpot</span>
          <span class="hero__divider" aria-hidden="true"></span>
          <span>Saturdays at <time datetime="21:00">21:00</time></span>
        </span>
      </h1>

      <a class="hero__cta" href="#buy-ticket">Buy ticket</a>
    </div>

    <p class="hero__compliance">
      <span class="hero__age">18+</span>
      <span>Play responsibly. Set a limit. <a href="#terms">T&amp;Cs apply</a>.</span>
    </p>

  </section>

</body>
</html>
